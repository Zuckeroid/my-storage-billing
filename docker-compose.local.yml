services:
  db:
    image: mariadb:10.11
    container_name: my-storage-fossbilling-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: fossbilling
      MARIADB_USER: fossbilling
      MARIADB_PASSWORD: fossbilling
    ports:
      - "3308:3306"
    volumes:
      - fossbilling-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: my-storage-fossbilling-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      APP_ENV: dev
    volumes:
      - ./src:/var/www/html

volumes:
  fossbilling-db-data:
